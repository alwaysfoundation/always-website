name: Report a problem
description: Something isn't working as it should.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: Please don't include anyone's personal details. Security issues go to security@alwaysfoundation.org.
  - type: dropdown
    id: area
    attributes:
      label: Where
      options: [Website, Always app, Always for churches and ministries, Response pages, API or SDK, Something else]
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to see it
      placeholder: "1. Go to …\n2. Tap …"
  - type: input
    id: device
    attributes:
      label: Device and browser
