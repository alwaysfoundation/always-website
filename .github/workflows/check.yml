name: check
on: [pull_request, push]
permissions: { contents: read }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Scan for secrets (gitleaks)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --config /repo/.gitleaks.toml --redact --no-banner
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: cd src && python3 build_site.py
      - run: git diff --stat --exit-code -- index.html || echo "index.html differs from a fresh build; rebuild before merging."
